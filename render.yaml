# Blueprint de Render: un solo servicio web Node que sirve la API (/api/v1) y la interfaz React (web/dist).
# Los valores marcados sync: false NO están en el repositorio: Render los pide al crear el Blueprint
# y se guardan cifrados en su panel (Environment). Ver docs/despliegue-render.md.
services:
  - type: web
    name: apprestopciones
    runtime: node
    plan: free
    # devDependencies (Babel, Vite) son necesarias para compilar; por eso --include=dev.
    buildCommand: npm ci --include=dev && npm run build && npm --prefix web ci --include=dev && npm --prefix web run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass # publica solo si GitHub Actions pasa
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0          # escuchar en todas las interfaces (Render enruta el tráfico al PORT que asigna)
      - key: API_URL
        value: /api/v1
      - key: SESSION_TTL_SECONDS
        value: "3600"
      - key: ALPACA_DATA_FEED
        value: iex
      - key: DATABASE
        value: db_opciones
      - key: TRUST_PROXY
        value: "1"              # proxies de Render delante del servicio: IP real del cliente (límite de accesos) y HSTS
      - key: WEBULL_ENTORNO
        value: paper            # único valor permitido (ADR-005)
      # ---- Secretos: se capturan en el panel de Render, nunca en Git ----
      - key: CONNECTION_STRING   # MongoDB Atlas (mongodb+srv://...)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ALPACA_KEY_ID       # claves Trading API PAPER (empiezan con PK)
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: WEBULL_APP_KEY      # opcional: entorno de pruebas (sandbox) de Webull
        sync: false
      - key: WEBULL_APP_SECRET
        sync: false
      - key: WEBULL_ACCOUNT_ID
        sync: false
      - key: SEC_USER_AGENT      # "AppRESTOpciones tu-correo"
        sync: false
      - key: AUTH_USERS_JSON     # salida de: npm run exportar:usuarios
        sync: false
