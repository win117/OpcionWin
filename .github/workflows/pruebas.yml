# Se ejecuta en cada subida: si algo falla, Render no publica (autoDeployTrigger: checksPass en render.yaml).
name: Pruebas
on:
  push:
    branches: [main, version-funcional]
  pull_request:
permissions:
  contents: read
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run lint
      - run: npm test
      - run: npm --prefix web run build
      # Regresión funcional E2E: la colección de Postman con Newman contra el servidor de pruebas (base en memoria).
      - name: E2E (Newman)
        run: mkdir -p output/pruebas && npm run test:e2e
      - name: Vulnerabilidades altas en lo que se publica
        run: npm audit --omit=dev --audit-level=high && npm --prefix web audit --omit=dev --audit-level=high
