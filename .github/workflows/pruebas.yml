# Se ejecuta en cada subida: si algo falla, Render no publica (autoDeployTrigger: checksPass en render.yaml).
name: Pruebas
on:
  push:
    branches: [main, version-funcional]
  pull_request:
permissions:
  contents: read
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run lint
      - run: npm test
      # Si alguna prueba falla, su nombre y el detalle del error quedan como anotaciones visibles en el resumen
      # de la ejecución (sin tener que abrir el registro completo).
      - name: Detalle de las pruebas fallidas
        if: failure()
        run: |
          node --test --test-reporter=tap scripts/check-models.cjs "tests/*.test.cjs" > tap.txt 2>&1 || true
          grep -E "^\s*not ok|^\s+(error|expected|actual|code|failureType|location):" tap.txt | head -40 | while IFS= read -r linea; do echo "::error::$linea"; done
      - run: npm --prefix web run build
      # Regresión funcional E2E: la colección de Postman con Newman contra el servidor de pruebas (base en memoria).
      - name: E2E (Newman)
        run: mkdir -p output/pruebas && npm run test:e2e
      - name: Vulnerabilidades altas en lo que se publica
        run: npm audit --omit=dev --audit-level=high && npm --prefix web audit --omit=dev --audit-level=high
